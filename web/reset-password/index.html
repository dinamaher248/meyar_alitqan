<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Reset Password</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f5f7fa;
          margin: 0;
          padding: 0;
        }

        .container {
          max-width: 420px;
          margin: 60px auto;
          background: #fff;
          padding: 24px;
          border-radius: 12px;
          box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h1 {
          margin-bottom: 8px;
        }

        p {
          color: #777;
          font-size: 14px;
          margin-bottom: 24px;
        }

        input {
          width: 100%;
          padding: 14px;
          margin-bottom: 16px;
          border-radius: 8px;
          border: 1px solid #ddd;
          font-size: 14px;
        }

        button {
          width: 100%;
          padding: 14px;
          background: #4CAF50;
          color: #fff;
          border: none;
          border-radius: 8px;
          font-size: 15px;
          cursor: pointer;
        }

        button:disabled {
          background: #999;
        }

        .error {
          color: red;
          margin-bottom: 12px;
        }

        .success {
          color: green;
          margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Reset Password</h1>
    <p>Enter your new password below</p>

    <div id="message"></div>

    <input id="password" type="password" placeholder="New password" />
    <input id="confirm" type="password" placeholder="Confirm password" />

    <button id="btn">Save Password</button>
</div>

<script>
    const SUPABASE_URL = "https://isslbnazdcixyociocya.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_WGOssCAVoSG5YOmbikqwWQ_Sfk8CNoy";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    let isSessionReady = false;

    // ✅ استخراج التوكن من URL
    async function initSession() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);

      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");

      if (!accessToken || !refreshToken) {
        document.getElementById("message").innerHTML =
          "<div class='error'>Invalid or expired link</div>";
        return;
      }

      const { error } = await supabaseClient.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken,
      });

      if (error) {
        document.getElementById("message").innerHTML =
          `<div class='error'>${error.message}</div>`;
      } else {
        isSessionReady = true;
      }
    }

    initSession();

    // ✅ تغيير الباسورد
    async function resetPassword() {
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const message = document.getElementById("message");
      const btn = document.getElementById("btn");

      message.innerHTML = "";

      if (!isSessionReady) {
        message.innerHTML =
          "<div class='error'>Loading... please wait</div>";
        return;
      }

      if (!password || !confirm) {
        message.innerHTML =
          "<div class='error'>Please fill all fields</div>";
        return;
      }

      if (password.length < 6) {
        message.innerHTML =
          "<div class='error'>Password must be at least 6 characters</div>";
        return;
      }

      if (password !== confirm) {
        message.innerHTML =
          "<div class='error'>Passwords do not match</div>";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Saving...";

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      btn.disabled = false;
      btn.innerText = "Save Password";

      if (error) {
        message.innerHTML =
          `<div class='error'>${error.message}</div>`;
      } else {
        message.innerHTML =
          "<div class='success'>Password changed successfully</div>";

        setTimeout(() => {
          window.location.replace(
            "https://meayar-alitqan.web.app/login"
          );
        }, 1500);
      }
    }

    document
      .getElementById("btn")
      .addEventListener("click", resetPassword);
</script>

</body>
</html>
